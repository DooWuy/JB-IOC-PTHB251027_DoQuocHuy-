name: FastShop CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Product Service
        run: mvn -f product-service/pom.xml clean package -DskipTests

      - name: Build Order Service
        run: mvn -f order-service/pom.xml clean package -DskipTests

      - name: Build API Gateway
        run: mvn -f GateWay/pom.xml clean package -DskipTests


  test:
    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Test Product Service
        run: mvn -f product-service/pom.xml test

      - name: Test Order Service
        run: mvn -f order-service/pom.xml test

      - name: Test Gateway
        run: mvn -f GateWay/pom.xml test


  docker-build:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Product Image
        run: docker build -t huylebron/product-service:latest ./product-service

      - name: Build Order Image
        run: docker build -t huylebron/order-service:latest ./order-service

      - name: Build Gateway Image
        run: docker build -t huylebron/api-gateway:latest ./GateWay


  push:

    needs: docker-build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Product Image
        run: docker build -t huylebron/product-service:latest ./product-service

      - name: Build Order Image
        run: docker build -t huylebron/order-service:latest ./order-service

      - name: Build Gateway Image
        run: docker build -t huylebron/api-gateway:latest ./GateWay

      - name: Push Product Image
        run: docker push huylebron/product-service:latest

      - name: Push Order Image
        run: docker push huylebron/order-service:latest

      - name: Push Gateway Image
        run: docker push huylebron/api-gateway:latest